<!-- =====================================================
     FORMULARIO DE LOGIN
     ===================================================== -->
<form class="theme-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h4>Iniciar Sesión</h4>
    <p>Ingresa tus credenciales para acceder</p>
    
    <!-- =====================================================
         MENSAJE DE ERROR GENERAL
         ===================================================== -->
    <div *ngIf="errorMessage" class="alert alert-danger mb-3" role="alert">
        <i class="fa fa-exclamation-circle me-2"></i>
        {{ errorMessage }}
    </div>

    <!-- =====================================================
         CAMPO: USUARIO
         ===================================================== -->
    <div class="form-group">
        <label class="col-form-label">Email</label>
        <input 
            class="form-control" 
            type="text" 
            formControlName="email"
            placeholder="Ingresa tu email"
            [class.is-invalid]="isFieldInvalid('email')">
        <div *ngIf="isFieldInvalid('email')" class="invalid-feedback">
            {{ getErrorMessage('email') }}
        </div>
    </div>

    <!-- =====================================================
         CAMPO: PASSWORD
         ===================================================== -->
    <div class="form-group">
        <label class="col-form-label">Contraseña</label>
        <div class="form-input relative">
            <input 
                class="form-control" 
                [type]="showPassword ? 'text' : 'password'" 
                formControlName="password"
                placeholder="••••••••"
                [class.is-invalid]="isFieldInvalid('password')">
            <div class="show-hide" (click)="togglePassword()">
                <span [class.show]="!showPassword"></span>
            </div>
        </div>
        <div *ngIf="isFieldInvalid('password')" class="invalid-feedback d-block">
            {{ getErrorMessage('password') }}
        </div>
    </div>

    <!-- =====================================================
         OPCIONES: RECORDAR Y OLVIDÉ CONTRASEÑA
         ===================================================== -->
    <div class="form-group mb-0">
        <div class="form-check flex gap-2 items-center">
            <input 
                class="checkbox-primary form-check-input custom-checkbox" 
                id="rememberMe" 
                type="checkbox"
                formControlName="rememberMe">
            <label class="text-muted form-check-label !mb-0" for="rememberMe">
                Recordar sesión
            </label>
        </div>
        <a class="link" href="javascript:void(0)" [routerLink]="['/auth/forgot-password']">
            ¿Olvidaste tu contraseña?
        </a>

        <!-- =====================================================
             BOTÓN SUBMIT
             ===================================================== -->
        <div class="text-end">
            <button 
                class="btn btn-primary btn-block w-full text-white mt-[24px]" 
                type="submit"
                [disabled]="isLoading">
                <span *ngIf="!isLoading">Iniciar Sesión</span>
                <span *ngIf="isLoading">
                    <i class="fa fa-spinner fa-spin me-2"></i>
                    Iniciando...
                </span>
            </button>
        </div>
    </div>

    <!-- =====================================================
         ENLACE A REGISTRO (Opcional)
         ===================================================== -->
    <!-- 
    <p class="text-center mt-[24px] !mb-0">
        ¿No tienes cuenta?
        <a class="ms-2" href="javascript:void(0)" [routerLink]="path">Crear cuenta</a>
    </p>
    -->
</form>
